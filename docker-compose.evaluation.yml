services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  minio:
    ports: !reset []

  qdrant:
    ports: !reset []

  ollama:
    ports: !reset []
    volumes:
      - evaluation_ollama_model_cache:/models

  api:
    ports: !reset []
    environment:
      HF_HOME: /evaluation-embedding-cache
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - evaluation_embedding_model_cache:/evaluation-embedding-cache

  worker:
    ports: !reset []
    environment:
      HF_HOME: /evaluation-embedding-cache
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes: !override
      - evaluation_embedding_model_cache:/evaluation-embedding-cache

  web:
    ports: !reset []

  evaluator:
    build:
      context: ./apps/api
    command:
      - python
      - -m
      - app.grounded_answer_evaluation
      - --manifest
      - /evaluation-fixtures/v1/manifest.json
      - --output-directory
      - /evaluation-output/${EVALUATION_RUN_ID}
      - --embedding-cache
      - /evaluation-embedding-cache
    environment:
      DATABASE_URL: postgresql+psycopg://workspace:${POSTGRES_PASSWORD:-workspace_dev}@postgres:5432/${POSTGRES_DB:-knowledge_workspace}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-documents}
      S3_REGION: ${S3_REGION:-us-east-1}
      HF_HOME: /evaluation-embedding-cache
    volumes:
      - ./apps/api/tests/fixtures/grounded_answers:/evaluation-fixtures:ro
      - ./.data/grounded-answer-evaluations:/evaluation-output
      - evaluation_embedding_model_cache:/evaluation-embedding-cache
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
      ollama:
        condition: service_healthy

volumes:
  evaluation_embedding_model_cache:
    name: asthing_evaluation_embedding_model_cache
    external: true
  evaluation_ollama_model_cache:
    name: asthing_evaluation_ollama_model_cache
    external: true
